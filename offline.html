<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - YouTube Aggregator</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f3f4f6; text-align: center; }
    </style>
</head>
<body>
    <div class="p-4">
        <h1 class="text-2xl font-bold text-red-600 mb-4">You are offline</h1>
        <p class="text-gray-700">This app requires an internet connection to fetch the latest videos. Please check your connection and try again.</p>
        <p class="text-gray-500 mt-2">Cached content might be available if you've visited before.</p>
    </div>
</body>
</html>
